name: CMS guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  cms-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit CMS route coverage
        run: npm run cms:audit

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Firestore and Storage rules tests
        run: npm run test:cms:rules

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run responsive E2E checks
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build
