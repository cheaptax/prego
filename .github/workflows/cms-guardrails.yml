name: CMS guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  cms-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Audit CMS route coverage
        run: npm run cms:audit

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run Firestore and Storage rules tests
        run: npm run test:cms:rules

      - name: Run audit evaluation rules tests
        run: npm run test:audit-evaluation:rules

      - name: Run audit evaluation Firestore E2E
        run: firebase emulators:exec --project demo-audit-evaluation-e2e --only firestore "node --conditions=react-server --import tsx --test lib/audit-evaluation/testing/e2e-flow.test.ts"
        env:
          FIREBASE_PROJECT_ID: demo-audit-evaluation-e2e

      - name: Verify audit report PDF rendering
        run: npm run verify:audit-report-pdf

      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium

      - name: Run responsive E2E checks
        run: npm run test:e2e

      - name: Build production bundle
        run: npm run build
